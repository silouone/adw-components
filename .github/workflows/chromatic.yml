name: chromatic

# Hosting only: Chromatic publishes Storybook on merge to main. It is never a pull-request check.
on:
  push:
    branches: [main]
    paths:
      - packages/**
      - .storybook/**
      - package.json
      - bun.lock
  workflow_dispatch:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - id: chromatic
        uses: chromaui/action@f305ef908327aee3b80b0e6b3bbb60a742eaa049 # v18.13.6
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          exitZeroOnChanges: true
          autoAcceptChanges: true
      - name: Links
        run: |
          echo "STORYBOOK_URL=${{ steps.chromatic.outputs.storybookUrl }}"
          echo "BUILD_URL=${{ steps.chromatic.outputs.buildUrl }}"
          {
            echo "STORYBOOK_URL=${{ steps.chromatic.outputs.storybookUrl }}"
            echo "BUILD_URL=${{ steps.chromatic.outputs.buildUrl }}"
          } >> "$GITHUB_STEP_SUMMARY"
